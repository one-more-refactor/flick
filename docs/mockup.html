<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speedread — design mockup</title>
<style>
  :root {
    --bg: #FAFAF7;
    --ink: #141110;
    --red: #E02D2D;
    --dim: #8A8380;
    --line: #E4E0DC;
    --panel: #FFFFFE;
    --inverse-ink: #FAFAF7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0A0A;
      --ink: #F2EFEC;
      --red: #F53B30;
      --dim: #7D7672;
      --line: #242020;
      --panel: #121010;
      --inverse-ink: #0B0A0A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0A0A;
    --ink: #F2EFEC;
    --red: #F53B30;
    --dim: #7D7672;
    --line: #242020;
    --panel: #121010;
    --inverse-ink: #0B0A0A;
  }
  :root[data-theme="light"] {
    --bg: #FAFAF7;
    --ink: #141110;
    --red: #E02D2D;
    --dim: #8A8380;
    --line: #E4E0DC;
    --panel: #FFFFFE;
    --inverse-ink: #FAFAF7;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 40px 16px 64px;
  }
  .sheet {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .wordmark { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  .wordmark .cursor { color: var(--red); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wordmark .cursor { animation: none; } }
  .tag { color: var(--dim); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; text-align: right; }

  /* ---------- panels ---------- */
  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .panel-label {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim);
  }
  .panel-label .counter { color: var(--red); letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }

  /* ---------- reader ---------- */
  .stage {
    position: relative;
    height: 148px;
    display: flex; align-items: center;
    overflow: hidden;
  }
  .notch {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 1px; height: 14px; background: var(--red);
  }
  .notch.top { top: 22px; } .notch.bottom { bottom: 22px; }
  .rail {
    position: absolute; left: 14px; right: 14px; height: 1px; background: var(--line);
  }
  .rail.top { top: 36px; } .rail.bottom { bottom: 36px; }

  .word {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: pre;
  }
  .word .pre  { text-align: right; }
  .word .orp  { color: var(--red); }
  .word .post { text-align: left; }

  .readout {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .readout b { color: var(--red); font-weight: 700; }

  .controls {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  button.play {
    font: inherit;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    background: var(--ink); color: var(--inverse-ink);
    border: none; padding: 8px 18px; cursor: pointer;
    min-width: 92px;
  }
  button.play:hover { background: var(--red); }
  button.play:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .wpm-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  input[type="range"] {
    flex: 1; appearance: none; -webkit-appearance: none;
    height: 2px; background: var(--line); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 0;
    background: var(--red); cursor: ew-resize;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 0; border: none;
    background: var(--red); cursor: ew-resize;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  .wpm-val { font-size: 11px; color: var(--ink); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .wpm-val b { color: var(--red); }

  .progress { height: 2px; background: var(--line); }
  .progress .fill { height: 100%; width: 0%; background: var(--red); }

  /* ---------- library ---------- */
  .lib { list-style: none; margin: 0; padding: 6px 0; }
  .lib li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .lib .idx { color: var(--dim); font-size: 11px; }
  .lib .title { text-transform: uppercase; letter-spacing: 0.06em; }
  .lib .leader {
    flex: 1;
    border-bottom: 1px dotted var(--dim);
    transform: translateY(-4px);
    opacity: 0.5;
  }
  .lib .pct { color: var(--red); font-size: 12px; }
  .lib li.sel, .lib li:hover, .lib li:focus-visible { background: var(--ink); }
  .lib li.sel .title, .lib li:hover .title, .lib li:focus-visible .title { color: var(--inverse-ink); }
  .lib li.sel .idx, .lib li:hover .idx, .lib li:focus-visible .idx { color: var(--inverse-ink); opacity: 0.6; }
  .lib li.sel .pct, .lib li:hover .pct, .lib li:focus-visible .pct { color: var(--red); }
  .lib li.sel .idx::before, .lib li:focus-visible .idx::before { content: "▶ "; color: var(--red); }
  .lib li:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .hint {
    padding: 8px 14px; border-top: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
  }
  .hint b { color: var(--red); font-weight: 400; }

  /* ---------- tokens ---------- */
  .tokens { display: flex; gap: 10px; flex-wrap: wrap; }
  .tok { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }
  .tok .chip { width: 14px; height: 14px; border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="wordmark">READ<span class="cursor">_</span></div>
    <div class="tag">design mockup<br>web · ios · android · tui</div>
  </header>

  <!-- READER -->
  <section class="panel" aria-label="Reader">
    <div class="panel-label"><span>Reader</span><span class="counter" id="count">000 / 044</span></div>
    <div class="stage">
      <div class="rail top"></div><div class="rail bottom"></div>
      <div class="notch top"></div><div class="notch bottom"></div>
      <div class="word" id="word">
        <span class="pre">rea</span><span class="orp">d</span><span class="post">ing</span>
      </div>
    </div>
    <div class="progress"><div class="fill" id="fill"></div></div>
    <div class="controls">
      <button class="play" id="play">Play</button>
      <div class="wpm-wrap">
        <input type="range" id="wpm" min="150" max="800" step="25" value="350" aria-label="Words per minute">
        <div class="wpm-val"><b id="wpmv">350</b> wpm</div>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="panel" aria-label="Library">
    <div class="panel-label"><span>Library</span><span class="counter" id="lib-count">4 books</span></div>
    <ul class="lib" id="lib" role="listbox" aria-label="Books list">
      <li class="sel" tabindex="0" role="option" aria-selected="true" aria-label="The Art of War, 62 percent read"><span class="idx">01</span><span class="title">The Art of War</span><span class="leader"></span><span class="pct">62%</span></li>
      <li tabindex="0" role="option" aria-selected="false" aria-label="Meditations, 18 percent read"><span class="idx">02</span><span class="title">Meditations</span><span class="leader"></span><span class="pct">18%</span></li>
      <li tabindex="0" role="option" aria-selected="false" aria-label="Flatland, 0 percent read"><span class="idx">03</span><span class="title">Flatland</span><span class="leader"></span><span class="pct">00%</span></li>
      <li tabindex="0" role="option" aria-selected="false" aria-label="Walden, 91 percent read"><span class="idx">04</span><span class="title">Walden</span><span class="leader"></span><span class="pct">91%</span></li>
    </ul>
    <div class="hint">↑↓ select · <b>enter</b>/<b>space</b> read · <b>a</b> add book</div>
  </section>

  <!-- TOKENS -->
  <footer class="tokens">
    <span class="tok"><span class="chip" style="background:#E02D2D"></span>signal red</span>
    <span class="tok"><span class="chip" style="background:#141110"></span>ink</span>
    <span class="tok"><span class="chip" style="background:#FAFAF7"></span>paper</span>
    <span class="tok"><span class="chip" style="background:#8A8380"></span>warm grey</span>
    <span class="tok">mono · both themes · red only accent</span>
  </footer>
</div>

<script>
  // Data model with different texts per book
  const BOOKS_DATA = {
    "The Art of War": "Sun Tzu said: The art of war is of vital importance to the State. It is a matter of life and death, a road either to safety or to ruin. Hence it is a subject of inquiry which can on no account be neglected. Therefore, measure your strength, prepare your strategies, and strike like thunder.",
    "Meditations": "Our life is what our thoughts make it. Waste no more time arguing about what a good man should be. Be one. Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig. Perfect tranquility consists in the good ordering of the mind.",
    "Flatland": "I call our world Flatland, not because we call it so, but to make its nature clearer to you, my happy readers, who are privileged to live in Space. Imagine a vast sheet of paper on which Straight Lines, Triangles, Squares, Pentagons, Hexagons, and other figures, instead of remaining fixed in their places, move freely about.",
    "Walden": "I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived. Simplicity, simplicity, simplicity! I say, let your affairs be as two or three."
  };

  let currentBookTitle = "The Art of War";
  let text = BOOKS_DATA[currentBookTitle];
  let words = text.split(/\s+/);

  // Optimal Recognition Point — slightly left of center.
  function orp(w) {
    const len = w.replace(/[^\w'’]/g, "").length || w.length;
    if (len <= 1) return 0;
    if (len <= 5) return 1;
    if (len <= 9) return 2;
    if (len <= 13) return 3;
    return 4;
  }
  // Per-word duration: base + long-word and punctuation dwell.
  function dwell(w, base) {
    let d = base;
    if (w.length > 8) d *= 1.3;
    if (/[,;:]$/.test(w)) d *= 1.6;
    if (/[.!?]$/.test(w)) d *= 2.1;
    return d;
  }

  const wordEl = document.getElementById("word");
  const fill = document.getElementById("fill");
  const count = document.getElementById("count");
  const playBtn = document.getElementById("play");
  const wpmInput = document.getElementById("wpm");
  const wpmVal = document.getElementById("wpmv");
  const libEl = document.getElementById("lib");
  const libCountEl = document.getElementById("lib-count");

  let i = 0, playing = false, timer = null;
  const pad = n => String(n).padStart(3, "0");

  function loadBook(title) {
    stop();
    currentBookTitle = title;
    text = BOOKS_DATA[title] || "Welcome to flick speedread app.";
    words = text.split(/\s+/);
    i = 0;
    show(0);
  }

  function show(idx) {
    if (!words[idx]) return;
    const w = words[idx];
    const p = orp(w);
    wordEl.innerHTML =
      '<span class="pre"></span><span class="orp"></span><span class="post"></span>';
    wordEl.children[0].textContent = w.slice(0, p);
    wordEl.children[1].textContent = w[p] || "";
    wordEl.children[2].textContent = w.slice(p + 1);
    fill.style.width = ((idx + 1) / words.length * 100) + "%";
    count.textContent = pad(idx + 1) + " / " + pad(words.length);
  }

  function tick() {
    if (!playing) return;
    show(i);
    const base = 60000 / Number(wpmInput.value);
    const d = dwell(words[i], base);
    i++;
    if (i >= words.length) { stop(); i = 0; return; }
    timer = setTimeout(tick, d);
  }
  function start() {
    playing = true;
    playBtn.textContent = "Pause";
    tick();
  }
  function stop() {
    playing = false;
    clearTimeout(timer);
    playBtn.textContent = "Play";
  }

  playBtn.addEventListener("click", () => playing ? stop() : start());
  wpmInput.addEventListener("input", () => { wpmVal.textContent = wpmInput.value; });

  // Update selection visually and load the corresponding book
  function selectItem(li) {
    Array.from(libEl.children).forEach(child => {
      child.classList.remove("sel");
      child.setAttribute("aria-selected", "false");
    });
    li.classList.add("sel");
    li.setAttribute("aria-selected", "true");
    const title = li.querySelector(".title").textContent;
    loadBook(title);
  }

  // Click handler for library items
  libEl.addEventListener("click", (e) => {
    const li = e.target.closest("li");
    if (li && libEl.contains(li)) {
      selectItem(li);
    }
  });

  // Dynamic Add Book handler
  function addNewBook() {
    const rawTitle = prompt("Enter book title:");
    if (!rawTitle) return;
    const title = rawTitle.trim();
    if (!title) return;

    const content = prompt("Enter book content / text:");
    if (!content || !content.trim()) return;

    // Add to our data store
    BOOKS_DATA[title] = content.trim();

    // Add to library UI
    const countBooks = libEl.children.length + 1;
    const idxStr = String(countBooks).padStart(2, "0");

    const li = document.createElement("li");
    li.tabIndex = 0;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", "false");
    li.setAttribute("aria-label", `${title}, 0 percent read`);

    const idxSpan = document.createElement("span");
    idxSpan.className = "idx";
    idxSpan.textContent = idxStr;

    const titleSpan = document.createElement("span");
    titleSpan.className = "title";
    titleSpan.textContent = title;

    const leaderSpan = document.createElement("span");
    leaderSpan.className = "leader";

    const pctSpan = document.createElement("span");
    pctSpan.className = "pct";
    pctSpan.textContent = "00%";

    li.appendChild(idxSpan);
    li.appendChild(titleSpan);
    li.appendChild(leaderSpan);
    li.appendChild(pctSpan);

    libEl.appendChild(li);
    libCountEl.textContent = `${countBooks} books`;

    // Select the newly added book
    selectItem(li);
    li.focus();
  }

  // Keyboard navigation for library items & dynamic add
  document.addEventListener("keydown", (e) => {
    const active = document.activeElement;
    const isLibraryFocused = active && active.tagName === "LI" && libEl.contains(active);

    if (e.key === "a" || e.key === "A") {
      // Avoid triggering when in prompt or input (though prompt blocks, this is good practice)
      if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;
      e.preventDefault();
      addNewBook();
      return;
    }

    if (isLibraryFocused) {
      const children = Array.from(libEl.children);
      const currentIndex = children.indexOf(active);

      if (e.key === "ArrowDown") {
        e.preventDefault();
        const nextIndex = (currentIndex + 1) % children.length;
        children[nextIndex].focus();
        selectItem(children[nextIndex]);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prevIndex = (currentIndex - 1 + children.length) % children.length;
        children[prevIndex].focus();
        selectItem(children[prevIndex]);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        selectItem(active);
        start();
      }
    } else {
      // Global hotkeys when not focusing on library items (e.g. Space to play/pause)
      if (e.key === " " && (!active || (active.tagName !== "INPUT" && active.tagName !== "BUTTON"))) {
        e.preventDefault();
        playing ? stop() : start();
      }
    }
  });

  // Initialize
  loadBook("The Art of War");
</script>
</body>
</html>
